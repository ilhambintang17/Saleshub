<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SalesHub - Enterprise Suite</title>
<meta name="description" content="SalesHub Enterprise Sales Management Dashboard"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"/>
<link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <h1>SalesHub</h1>
    <p>Enterprise Suite</p>
  </div>
  <div class="sidebar-btn">
    <button onclick="generateReport()">
      <span class="material-symbols-outlined" style="font-size:18px">analytics</span>
      Generate Report
    </button>
  </div>
  <div class="sidebar-nav" id="sidebarNav"></div>
  <div class="sidebar-footer">
    <a href="#"><span class="material-symbols-outlined">settings</span> Settings</a>
    <a href="#"><span class="material-symbols-outlined">logout</span> Logout</a>
  </div>
</nav>

<!-- Main -->
<div class="main-content">
  <header class="top-header">
    <div class="search-box">
      <span class="material-symbols-outlined">search</span>
      <input type="text" placeholder="Search..." id="globalSearch"/>
    </div>
    <div class="header-actions">
      <button><span class="material-symbols-outlined">notifications</span></button>
      <button><span class="material-symbols-outlined">help</span></button>
      <button><span class="material-symbols-outlined">settings</span></button>
      <div class="avatar">A</div>
    </div>
  </header>
  <div class="page-content" id="pageContent">
    <div class="loading"><div class="spinner"></div> Loading...</div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Modal</h3>
      <button class="modal-close" onclick="closeModal()"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- Confirm Dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-dialog">
    <div class="confirm-icon" id="confirmIcon">
      <span class="material-symbols-outlined">warning</span>
    </div>
    <h3 class="confirm-title" id="confirmTitle">Are you sure?</h3>
    <p class="confirm-message" id="confirmMessage">This action cannot be undone.</p>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="confirmCancel">Cancel</button>
      <button class="btn btn-danger" id="confirmOk">Delete</button>
    </div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script src="/app.js"></script>
</body>
</html>
